<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a5c4e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Ersenbox Kur'an-Dinle 26</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect fill='%231a5c4e' width='512' height='512' rx='80'/><text x='50%' y='55%' font-size='280' text-anchor='middle' dominant-baseline='middle'>📖</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://quran.islam-db.com" crossorigin>
    <link rel="preconnect" href="https://api.alquran.cloud" crossorigin>
    <link rel="preconnect" href="https://cdn.islamic.network" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1:#f5f0e8; --bg2:#e8e0d0; --card:#ffffff; --panel:#f5f0e8;
            --text:#333333; --muted:#666666; --accent:#1a5c4e; --accent2:#2d7a6b;
            --arabic-font:'Amiri',serif; --zoom:1;
        }
        body.dark {
            --bg1:#101413; --bg2:#0b0f0e; --card:#1b2422; --panel:#16201d;
            --text:#e6e6e6; --muted:#9fb3ad; --accent:#2d7a6b; --accent2:#3a917f;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%); min-height:100vh; overflow-x:hidden; }
        .container { max-width:1200px; margin:0 auto; background:var(--card); min-height:100vh; box-shadow:0 0 20px rgba(0,0,0,.1); }
        header { background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%); color:#fff; padding:20px; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,.1); position:sticky; top:0; z-index:100; }
        header h1 { font-size:24px; margin-bottom:10px; }
        .header-buttons { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:15px; }
        .header-btn { background:rgba(255,255,255,.2); border:2px solid #fff; color:#fff; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:14px; transition:all .3s; display:flex; align-items:center; gap:5px; }
        .header-btn:hover { background:#fff; color:var(--accent); }
        /* DİL MENÜSÜ */
        .lang-wrap { position:relative; display:inline-block; }
        .lang-menu { display:none; position:absolute; top:115%; left:50%; transform:translateX(-50%); background:var(--card); border:2px solid var(--accent); border-radius:12px; z-index:300; min-width:170px; box-shadow:0 8px 20px rgba(0,0,0,.3); overflow:hidden; }
        .lang-menu.open { display:block; }
        .lang-item { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; color:var(--text); font-size:14px; background:var(--card); }
        .lang-item:hover { background:var(--accent); color:#fff; }
        .lang-item .flag { font-size:20px; }
        .main-content { padding:20px; }
        .page-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:15px; background:var(--panel); border-radius:12px; }
        .nav-btn { background:var(--accent); color:#fff; border:none; padding:12px 24px; border-radius:8px; cursor:pointer; font-size:16px; transition:all .3s; }
        .nav-btn:hover { background:var(--accent2); }
        .nav-btn:disabled { background:#ccc; cursor:not-allowed; }
        .page-info { text-align:center; flex:1; }
        .page-display { font-size:18px; font-weight:bold; color:var(--accent); margin-bottom:5px; }
        .page-title { font-size:14px; color:var(--muted); }
        /* ZOOM ÇUBUĞU */
        .zoom-bar { display:flex; justify-content:center; align-items:center; gap:12px; margin-bottom:12px; }
        .zoom-btn { background:var(--accent); color:#fff; border:none; width:44px; height:44px; border-radius:50%; font-size:16px; font-weight:bold; cursor:pointer; }
        .zoom-btn:hover { background:var(--accent2); }
        .zoom-label { font-weight:bold; color:var(--accent); min-width:56px; text-align:center; }
        .mushaf-container { background:var(--card); border:3px solid var(--accent); border-radius:12px; padding:20px; margin-bottom:20px; position:relative; min-height:400px; display:flex; align-items:center; justify-content:center; overflow:auto; transition:background .3s,border-color .3s; }
        #mushafImage { max-width:none; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.1); display:none; transition:filter .3s; }
        #mushafImage.loaded { display:block; }
        .loader { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:none; }
        .spinner { width:50px; height:50px; border:4px solid rgba(128,128,128,.2); border-top:4px solid var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
        .tajweed-container { display:none; background:var(--card); border:3px solid var(--accent); border-radius:12px; padding:25px; margin-bottom:20px; }
        .tajweed-ayah { font-family:var(--arabic-font); font-size:calc(30px * var(--zoom)); line-height:2.3; direction:rtl; text-align:right; color:var(--text); margin-bottom:18px; border-radius:8px; padding:6px 10px; transition:all .3s; }
        .tajweed-num { display:inline-block; background:var(--accent); color:#fff; font-size:14px; font-family:sans-serif; border-radius:50%; padding:4px 9px; margin-left:8px; vertical-align:middle; }
        .tw-ghunnah { color:#0a8f3c; } .tw-madd { color:#d23b3b; } .tw-qalqalah { color:#1867c0; } .tw-ikhfa { color:#8a3bd0; }
        body.dark .tw-ghunnah { color:#4ade80; } body.dark .tw-madd { color:#f87171; }
        body.dark .tw-qalqalah { color:#60a5fa; } body.dark .tw-ikhfa { color:#c084fc; }
        /* TAKİP (okunan ayet vurgusu) */
        .playing { outline:3px solid #d23b3b; background:rgba(210,59,59,.10); }
        .playing .ayah-number, .playing .tajweed-num { background:#d23b3b; }
        .playing::after { content:' 🔊'; }
        .action-buttons { display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
        .action-btn { background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%); color:#fff; border:none; padding:15px 30px; border-radius:12px; cursor:pointer; font-size:16px; font-weight:bold; transition:all .3s; display:flex; align-items:center; gap:8px; }
        .action-btn:hover { transform:translateY(-2px); }
        .action-btn.on { outline:3px solid #e0a458; }
        .meal-container, .latin-container { background:var(--panel); border-radius:12px; padding:20px; margin-bottom:20px; }
        .meal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; padding-bottom:15px; border-bottom:2px solid var(--accent); flex-wrap:wrap; gap:10px; }
        .meal-title { font-size:20px; font-weight:bold; color:var(--accent); }
        .mini-btn { background:var(--card); border:2px solid var(--accent); color:var(--text); padding:6px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
        .mini-btn.active { background:var(--accent); color:#fff; }
        .meal-content, .latin-content { line-height:1.8; font-size:calc(16px * var(--zoom)); color:var(--text); }
        .ayah { margin-bottom:20px; padding:15px; background:var(--card); border-radius:8px; border-left:4px solid var(--accent); transition:all .3s; }
        .ayah-number { display:inline-block; background:var(--accent); color:#fff; padding:4px 8px; border-radius:50%; font-size:12px; margin-right:10px; }
        .ayah-arabic { font-size:calc(26px * var(--zoom)); font-family:var(--arabic-font); text-align:right; direction:rtl; margin:10px 0; line-height:2.1; color:var(--text); }
        .ayah-translation { color:var(--muted); font-size:calc(15px * var(--zoom)); }
        .latin-item { background:var(--card); border-radius:8px; padding:10px 15px; margin-bottom:8px; color:var(--text); font-style:italic; font-size:calc(16px * var(--zoom)); transition:all .3s; }
        .latin-item b { color:var(--accent); font-style:normal; margin-right:8px; }
        .audio-player { background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%); color:#fff; padding:20px; border-radius:12px; margin-bottom:20px; }
        .audio-controls { display:flex; align-items:center; gap:15px; justify-content:center; }
        .audio-btn { background:rgba(255,255,255,.2); border:2px solid #fff; color:#fff; width:50px; height:50px; border-radius:50%; cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center; }
        .audio-btn:hover { background:#fff; color:var(--accent); }
        .audio-progress { height:6px; background:rgba(255,255,255,.3); border-radius:3px; overflow:hidden; margin-top:15px; }
        .audio-progress-bar { height:100%; background:#fff; width:0%; }
        .settings-panel { background:var(--panel); border-radius:12px; padding:20px; margin-bottom:20px; display:none; }
        .settings-panel.active { display:block; }
        .setting-group { margin-bottom:20px; }
        .setting-label { font-weight:bold; color:var(--accent); margin-bottom:8px; display:block; }
        .setting-options { display:flex; gap:10px; flex-wrap:wrap; }
        .setting-option { background:var(--card); border:2px solid var(--accent); color:var(--text); padding:10px 20px; border-radius:8px; cursor:pointer; transition:all .3s; }
        .setting-option:hover { background:var(--accent); color:#fff; }
        .setting-option.active { background:var(--accent); color:#fff; }
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:15px 30px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.3); z-index:1000; display:none; max-width:90%; text-align:center; }
        .toast.show { display:block; animation:slideUp .3s ease-out; }
        @keyframes slideUp { from{transform:translateX(-50%) translateY(100px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
        .sajda-list { background:var(--panel); border-radius:12px; padding:20px; margin-bottom:20px; }
        .sajda-title { font-size:18px; font-weight:bold; color:var(--accent); margin-bottom:15px; }
        .sajda-item { background:var(--card); color:var(--text); padding:12px; border-radius:8px; margin-bottom:8px; cursor:pointer; border-left:4px solid var(--accent); }
        @media (max-width:768px) {
            .main-content { padding:10px; }
            header h1 { font-size:18px; }
            .header-btn { padding:6px 12px; font-size:12px; }
            .nav-btn { padding:10px 16px; font-size:14px; }
            .action-btn { padding:12px 20px; font-size:14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Ersenbox Kur'an-Dinle 26</h1>
            <div class="header-buttons">
                <div class="lang-wrap">
                    <button class="header-btn" id="langBtn" onclick="toggleLangMenu(event)">🇹</button>
                    <div class="lang-menu" id="langMenu">
                        <div class="lang-item" onclick="setLang('tr')"><span class="flag">🇹🇷</span> Türkçe</div>
                        <div class="lang-item" onclick="setLang('en')"><span class="flag">🇬🇧</span> English</div>
                        <div class="lang-item" onclick="setLang('de')"><span class="flag">🇩🇪</span> Deutsch</div>
                        <div class="lang-item" onclick="setLang('fr')"><span class="flag">🇫🇷</span> Français</div>
                    </div>
                </div>
                <button class="header-btn" id="themeBtn" onclick="toggleDarkMode()">🌙</button>
                <button class="header-btn" id="bookmarkBtn" onclick="saveBookmark()">🔖</button>
                <button class="header-btn" id="sajdahHeaderBtn" onclick="showSajdaAyat()">۩ Secde</button>
                <button class="header-btn" id="settingsHeaderBtn" onclick="toggleSettings()">⚙️ Ayarlar</button>
            </div>
        </header>

        <div class="main-content">
            <div class="page-nav">
                <button class="nav-btn" id="prevBtn" onclick="previousPage()">◀ Önceki</button>
                <div class="page-info">
                    <div class="page-display" id="pageDisplay">1 / 604</div>
                    <div class="page-title" id="pageTitle">Al-Fatiha</div>
                </div>
                <button class="nav-btn" id="nextBtn" onclick="nextPage()">Sonraki ▶</button>
            </div>

            <div class="zoom-bar">
                <button class="zoom-btn" onclick="zoomChange(-0.1)" title="Küçült">A−</button>
                <span class="zoom-label" id="zoomLabel">%100</span>
                <button class="zoom-btn" onclick="zoomChange(0.1)" title="Büyüt">A+</button>
            </div>

            <div class="mushaf-container" id="mushafContainer">
                <div class="loader" id="loader"><div class="spinner"></div></div>
                <img id="mushafImage" alt="Kur'an Sayfası" decoding="async">
            </div>

            <div class="tajweed-container" id="tajweedContainer"></div>

            <div class="action-buttons">
                <button class="action-btn" id="mealBtn" onclick="toggleMeal()">📖 Meal</button>
                <button class="action-btn" id="listenBtn" onclick="toggleAudio()">▶ Dinle</button>
                <button class="action-btn" id="latinBtn" onclick="toggleLatin()">🔤 Latince</button>
            </div>

            <div class="meal-container" id="mealContainer" style="display:none;">
                <div class="meal-header"><div class="meal-title" id="mealTitleEl">📖 Meal</div></div>
                <div class="meal-content" id="mealContent"><p style="text-align:center;color:var(--muted);">Yükleniyor...</p></div>
            </div>

            <div class="latin-container" id="latinContainer" style="display:none;">
                <div class="meal-header">
                    <div class="meal-title" id="latinTitleEl">🔤 Latince Okunuş</div>
                    <div>
                        <button class="mini-btn active" data-group="latinmode" data-value="tr" onclick="setLatinMode('tr')">🇹🇷 Türkçe Okunuş</button>
                        <button class="mini-btn" data-group="latinmode" data-value="en" onclick="setLatinMode('en')">🇬🇧 EN Transliteration</button>
                    </div>
                </div>
                <div class="latin-content" id="latinContent"><p style="text-align:center;color:var(--muted);">Yükleniyor...</p></div>
            </div>

            <div class="audio-player" id="audioPlayer" style="display:none;">
                <div class="audio-controls">
                    <button class="audio-btn" onclick="previousAyah()">⏮</button>
                    <button class="audio-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
                    <button class="audio-btn" onclick="nextAyah()">⏭</button>
                </div>
                <div class="audio-progress"><div class="audio-progress-bar" id="audioProgressBar"></div></div>
                <div style="text-align:center;margin-top:10px;" id="audioInfo">Alafasy - 0:00 / 0:00</div>
            </div>

            <div class="settings-panel" id="settingsPanel">
                <div class="setting-group">
                    <button class="setting-option" id="gotoBookmarkBtn" style="display:none;" onclick="gotoBookmark()"></button>
                </div>
                <div class="setting-group">
                    <label class="setting-label" id="followLabel">🎯 Takip (Okunan Ayet Vurgusu)</label>
                    <div class="setting-options">
                        <button class="setting-option active" id="followBtn" onclick="toggleFollow()">Okunan ayeti vurgula + takip et</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" id="styleLabel">🖼️ Mushaf Stili</label>
                    <div class="setting-options">
                        <button class="setting-option active" data-group="style" data-value="klasik" onclick="setMushafStyle('klasik')">📖 Klasik</button>
                        <button class="setting-option" data-group="style" data-value="sepya" onclick="setMushafStyle('sepya')">🎨 Sepya (Renkli)</button>
                        <button class="setting-option" data-group="style" data-value="negatif" onclick="setMushafStyle('negatif')">🌙 Negatif (Gece)</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" id="tajweedLabel">🎨 Tecvidli Metin</label>
                    <div class="setting-options">
                        <button class="setting-option" id="tajweedBtn" onclick="toggleTajweed()">Renkli tecvid gösterimi</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" id="speedLabel">⚡ Oynatma Hızı</label>
                    <div class="setting-options">
                        <button class="setting-option" data-group="speed" data-value="0.5" onclick="setSpeed(0.5)">0.5x</button>
                        <button class="setting-option" data-group="speed" data-value="0.75" onclick="setSpeed(0.75)">0.75x</button>
                        <button class="setting-option active" data-group="speed" data-value="1" onclick="setSpeed(1)">1x</button>
                        <button class="setting-option" data-group="speed" data-value="1.25" onclick="setSpeed(1.25)">1.25x</button>
                        <button class="setting-option" data-group="speed" data-value="1.5" onclick="setSpeed(1.5)">1.5x</button>
                        <button class="setting-option" data-group="speed" data-value="2" onclick="setSpeed(2)">2x</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" id="mealSourceLabel">📚 Meal Kaynağı</label>
                    <div class="setting-options">
                        <button class="setting-option active" data-group="meal" data-value="tr.diyanet" onclick="setMeal('tr.diyanet')">🇹 Diyanet</button>
                        <button class="setting-option" data-group="meal" data-value="tr.yazir" onclick="setMeal('tr.yazir')">📚 Elmalılı Hamdi</button>
                        <button class="setting-option" data-group="meal" data-value="en.sahih" onclick="setMeal('en.sahih')">🇬 English</button>
                        <button class="setting-option" data-group="meal" data-value="de.aburida" onclick="setMeal('de.aburida')">🇩🇪 Deutsch</button>
                        <button class="setting-option" data-group="meal" data-value="fr.hamidullah" onclick="setMeal('fr.hamidullah')">🇫🇷 Français</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" id="fontLabel">🔤 Yazı Tipi</label>
                    <div class="setting-options">
                        <button class="setting-option active" data-group="font" data-value="uthmani" onclick="setFont('uthmani')">Uthmani</button>
                        <button class="setting-option" data-group="font" data-value="noto" onclick="setFont('noto')">Noto Naskh</button>
                        <button class="setting-option" data-group="font" data-value="amiri" onclick="setFont('amiri')">Amiri</button>
                        <button class="setting-option" data-group="font" data-value="scheherazade" onclick="setFont('scheherazade')">Scheherazade</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" id="reciterLabel">🎙️ Okuyucu</label>
                    <div class="setting-options" id="reciterOptions"></div>
                </div>
            </div>

            <div class="sajda-list" id="sajdaList" style="display:none;">
                <div class="sajda-title" id="sajdaTitleEl">۩ Secde Ayetleri (Hanefi — 14 Ayet)</div>
                <div id="sajdaContent"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <audio id="audioEl"></audio>

    <script>
        /* ================= DEĞİŞKENLER ================= */
        let currentPage = 1;
        const totalPages = 604;
        let currentLang = localStorage.getItem('ersenbox_lang') || 'tr';
        let currentAyahIndex = 0;
        let pageAyahs = [];
        let isPlaying = false;
        let loadToken = 0;
        let latinVisible = localStorage.getItem('ersenbox_latin') === '1';
        let latinMode = localStorage.getItem('ersenbox_latinmode') || 'tr';
        let darkMode = localStorage.getItem('ersenbox_dark') === '1';
        let lastLatinPage = 0;
        let mushafStyle = localStorage.getItem('ersenbox_style') || 'klasik';
        let zoom = parseFloat(localStorage.getItem('ersenbox_zoom')) || 1;
        let brIndex = 0;

        const settings = Object.assign(
            { meal:'tr.diyanet', reciter:'ar.alafasy', speed:1, font:'uthmani', tajweed:false, follow:true },
            JSON.parse(localStorage.getItem('ersenbox_settings') || '{}')
        );
        const saveSettings = () => localStorage.setItem('ersenbox_settings', JSON.stringify(settings));

        /* ================= OKUYUCULAR (bitrate yedekli) ================= */
        const RECITERS = {
            'ar.alafasy':            { name:'Mishary Alafasy',        br:[128,64] },
            'ar.abdulbasitmurattal': { name:'Abdul Basit',            br:[192,64] },
            'ar.abdurrahmaansudais': { name:'Abdurrahman Sudais',     br:[192,64] },
            'ar.saoodshuraym':       { name:'Saud Shuraym',           br:[64,128] },
            'ar.mahermuaiqly':       { name:'Maher Al-Muaiqly',       br:[64,128] },
            'ar.husary':             { name:'Mahmoud Khalil Husary',  br:[128,64] },
            'ar.minshawi':           { name:'Al-Minshawi',            br:[128,64] },
            'ar.hudhaify':           { name:'Al-Hudhaify',            br:[128,64] },
            'ar.muhammadayyoub':     { name:'Muhammad Ayyoub',        br:[64,128] },
            'ar.yasserdossari':      { name:'Yasser Dossari',         br:[128,64] }
        };

        const FLAG = { tr:'🇹🇷', en:'🇬🇧', de:'🇩🇪', fr:'🇫🇷' };

        /* ================= ÇEVİRİLER ================= */
        const I18N = {

        /* ================= TECVİD ================= */
        function colorTajweed(t) {
            const parts = [];
            const put = (cls, m) => { parts.push(`<span class="${cls}">${m}</span>`); return `\u0001${parts.length-1}\u0002`; };
            t = t.replace(/([نم]\u0651[\u064B-\u065F\u0670]*)/g, m => put('tw-ghunnah', m));
            t = t.replace(/([قطبجد]\u0652)/g, m => put('tw-qalqalah', m));
            t = t.replace(/(\u0670)/g, m => put('tw-madd', m));
            t = t.replace(/([آٱ])/g, m => put('tw-madd', m));
            t = t.replace(/([ًٌٍ])\s*([تثجذزسشصضطظفقك])/g, (a,b,c) => b + put('tw-ikhfa', c));
            return t.replace(/\u0001(\d+)\u0002/g, (m,i) => parts[i]);
        }

        /* ================= TÜRKÇE OKUNUŞ ================= */
        function trTransliterate(s) {
            const C = {ء:"'",أ:"'",إ:"'",ئ:"'",ؤ:"'",ٱ:"a",ب:"b",ت:"t",ث:"s",ج:"c",ح:"h",خ:"h",د:"d",ذ:"z",ر:"r",ز:"z",س:"s",ش:"ş",ص:"s",ض:"d",ط:"t",ظ:"z",ع:"'",غ:"g",ف:"f",ق:"k",ك:"k",ل:"l",م:"m",ن:"n",ه:"h",ى:"a",ة:"t",ا:"A",و:"W",ي:"Y"};
            const isMark = ch => /[\u064B-\u065F\u0670\u06D6-\u06ED]/.test(ch);
            let out = "", prevVowel = "";
            for (let i = 0; i < s.length; i++) {
                const ch = s[i];
                if (ch === ' ') { out += ' '; continue; }
                if (isMark(ch) || ch === 'ـ') continue;
                const base = C[ch];
                if (base === undefined) continue;
                let j = i+1, fatha=false,kasra=false,damma=false,sukun=false,shadda=false,madda=false,tF=false,tK=false,tD=false;
                while (j < s.length && isMark(s[j])) {
                    const m = s[j];
                    if(m==='َ')fatha=true; else if(m==='ِ')kasra=true; else if(m==='ُ')damma=true;
                    else if(m==='ْ')sukun=true; else if(m==='ّ')shadda=true; else if(m==='ٰ')madda=true;
                    else if(m==='ً')tF=true; else if(m==='ٍ')tK=true; else if(m==='ٌ')tD=true;
                    j++;
                }
                let cons = base, vow = '';
                if (base === 'A') { cons=''; vow = (fatha||madda||prevVowel==='a') ? 'â' : (kasra?'i':damma?'u':'â'); }
                else if (base === 'W') {
                    if (sukun && prevVowel==='u') { cons=''; vow='û'; }
                    else if (!fatha && !kasra && !damma) { cons=''; vow='û'; }
                    else { cons='v'; vow = fatha?'a':kasra?'i':'u'; }
                }
                else if (base === 'Y') {
                    if (sukun && prevVowel==='i') { cons=''; vow='î'; }
                    else if (!fatha && !kasra && !damma) { cons=''; vow='î'; }
                    else { cons='y'; vow = fatha?'a':kasra?'i':'u'; }
                }
                else {
                    if (tF) vow='an'; else if (tK) vow='in'; else if (tD) vow='un';
                    else if (fatha) vow='a'; else if (kasra) vow='i'; else if (damma) vow='u';
                    if (shadda) cons = base + base;
                }
                out += cons + vow;
                prevVowel = (fatha||tF)?'a':(kasra||tK)?'i':(damma||tD)?'u':prevVowel;
                i = j - 1;
            }
            return out.replace(/\s+/g,' ').trim();
        }

        /* ================= MEAL ================= */
        let mealCache = null;
        async function loadMeal(pageNum) {
            const content = document.getElementById('mealContent');
            content.innerHTML = `<p style="text-align:center;color:var(--muted);">${T('loading')}</p>`;
            try {
                const [ar, meal] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`).then(r => r.json()),
                    fetch(`https://api.alquran.cloud/v1/page/${pageNum}/${settings.meal}`).then(r => r.json())
                ]);
                if (ar.code === 200 && ar.data && ar.data.ayahs) {
                    pageAyahs = ar.data.ayahs;
                    const surahNum = ar.data.ayahs[0].surah.number;
                    document.getElementById('pageTitle').textContent = (SURAH_TR[surahNum] || ar.data.ayahs[0].surah.englishName);
                    mealCache = { ar: ar.data.ayahs, meal: (meal.code === 200 ? meal.data.ayahs : null) };
                    renderMealCache();
                    if (settings.tajweed) renderTajweed();
                } else content.innerHTML = `<p>${T('mealError')}</p>`;
            } catch(e) { content.innerHTML = `<p>${T('mealError')}</p>`; }
        }
        function renderMealCache() {
            if (!mealCache) return;
            document.getElementById('mealContent').innerHTML = mealCache.ar.map((ayah, i) => {
                const arabic = settings.tajweed ? colorTajweed(ayah.text) : ayah.text;
                const trans = mealCache.meal && mealCache.meal[i] ? mealCache.meal[i].text : '';
                return `<div class="ayah" data-idx="${i}">
                    <span class="ayah-number">${ayah.numberInSurah}</span>
                    <div class="ayah-arabic">${arabic}</div>
                    <div class="ayah-translation">${trans}</div>
                </div>`;
            }).join('');
        }

        function setLatinMode(mode) {

        async function loadLatin(pageNum) {
            const content = document.getElementById('latinContent');
            content.innerHTML = `<p style="text-align:center;color:var(--muted);">${T('loading')}</p>`;
            try {
                if (latinMode === 'en') {
                    const res = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/en.transliteration`);
                    const data = await res.json();
                    if (data.code === 200) {
                        lastLatinPage = pageNum;
                        content.innerHTML = data.data.ayahs.map((a,i) =>
                            `<div class="latin-item" data-idx="${i}"><b>${a.surah.number}:${a.numberInSurah}</b>${a.text}</div>`).join('');
                    } else content.innerHTML = `<p>${T('latinError')}</p>`;
                } else {
                    let ayahs = (mealCache && mealCache.ar) ? mealCache.ar : null;
                    if (!ayahs) {
                        const res = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`);
                        const data = await res.json();
                        if (data.code === 200) ayahs = data.data.ayahs;
                    }
                    if (ayahs) {
                        lastLatinPage = pageNum;
                        content.innerHTML = ayahs.map((a,i) =>
                            `<div class="latin-item" data-idx="${i}"><b>${a.surah.number}:${a.numberInSurah}</b>${trTransliterate(a.text)}</div>`).join('');
                    } else content.innerHTML = `<p>${T('latinError')}</p>`;
                }
            } catch(e) { content.innerHTML = `<p>${T('latinError')}</p>`; }
        }

        function toggleMeal() {
            const c = document.getElementById('mealContainer');
            c.style.display = c.style.display === 'none' ? 'block' : 'none';
        }

        /* ================= SAYFA YÜKLEME ================= */
        const pad3 = n => String(n).padStart(3, '0');
        const pageSources = n => [
            `https://cdn.jsdelivr.net/gh/GovarJabbar/Quran-PNG@master/${pad3(n)}.png`,
            `https://quran.islam-db.com/data/pages/quranpages_1024/images/page${pad3(n)}.png`,
            `https://raw.githubusercontent.com/GovarJabbar/Quran-PNG/master/${pad3(n)}.png`
        ];
        function prefetchNeighbors(pageNum) {
            [pageNum+1, pageNum+2, pageNum-1].forEach(n => {
                if (n >= 1 && n <= totalPages) { const im = new Image(); im.src = pageSources(n)[0]; }
            });
        }
        async function loadPage(pageNum) {
            if (pageNum < 1 || pageNum > totalPages) return;
            const token = ++loadToken;
            currentPage = pageNum;
            localStorage.setItem('ersenbox_lastPage', pageNum);
            updateTexts();
            document.getElementById('pageDisplay').textContent = `${pageNum} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = (pageNum === 1);
            document.getElementById('nextBtn').disabled = (pageNum === totalPages);

            const loader = document.getElementById('loader');
            const img = document.getElementById('mushafImage');
            loader.style.display = 'block';
            img.classList.remove('loaded');
            img.style.display = 'none';

            const sources = pageSources(pageNum);
            let idx = 0, timer = null;
            const fail = () => { if (token !== loadToken) return; clearTimeout(timer); idx++; nextSource(); };
            const nextSource = () => {
                if (token !== loadToken) return;
                if (idx >= sources.length) { loader.style.display = 'none'; showToast(T('loadError')); return; }
                img.src = sources[idx];
                timer = setTimeout(fail, 8000);
            };
            img.onload = () => {
                if (token !== loadToken) return;
                clearTimeout(timer);
                loader.style.display = 'none';
                img.style.display = 'block';
                img.classList.add('loaded');
                applyZoom();
                applyMushafStyle();
                showToast(T('loaded', pageNum));
                prefetchNeighbors(pageNum);
            };
            img.onerror = fail;
            nextSource();

            loadMeal(pageNum);
            if (latinVisible) loadLatin(pageNum);
        }
        function nextPage() { if (currentPage < totalPages) loadPage(currentPage + 1); }
        function previousPage() { if (currentPage > 1) loadPage(currentPage - 1); }

        /* ================= SES (bitrate yedekli) ================= */
        function toggleAudio() {
            const p = document.getElementById('audioPlayer');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
            if (p.style.display === 'block' && !isPlaying && pageAyahs.length) playAyah(0);
        }
        function playAyah(index) {
            if (index < 0 || index >= pageAyahs.length) return;
            currentAyahIndex = index;
            brIndex = 0;
            setAudioSrc();
            highlightAyah(index);
        }
        function setAudioSrc() {
            const rec = RECITERS[settings.reciter] || { br:[128,64,192] };
            const ayah = pageAyahs[currentAyahIndex];
            const br = rec.br[Math.min(brIndex, rec.br.length - 1)];
            const audio = document.getElementById('audioEl');
            audio.src = `https://cdn.islamic.network/quran/audio/${br}/${settings.reciter}/${ayah.number}.mp3`;
            audio.playbackRate = settings.speed;
            audio.play().catch(() => {});
            isPlaying = true;
            document.getElementById('playPauseBtn').textContent = '⏸';
        }
        function togglePlay() {
            const audio = document.getElementById('audioEl');
            if (isPlaying) { audio.pause(); isPlaying = false; document.getElementById('playPauseBtn').textContent = '▶'; }
            else if (audio.src) { audio.play(); isPlaying = true; document.getElementById('playPauseBtn').textContent = '⏸'; }
            else if (pageAyahs.length) playAyah(0);
        }
        function nextAyah() { if (currentAyahIndex < pageAyahs.length - 1) playAyah(currentAyahIndex + 1); }
        function previousAyah() { if (currentAyahIndex > 0) playAyah(currentAyahIndex - 1); }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        /* ================= BAŞLANGIÇ ================= */
        const audioEl = document.getElementById('audioEl');
        audioEl.addEventListener('ended', () => nextAyah());
        audioEl.addEventListener('error', () => {
            const rec = RECITERS[settings.reciter] || { br:[128] };
            brIndex++;
            if (brIndex < rec.br.length) setAudioSrc();
            else { showToast(T('audioFail', RECITERS[settings.reciter] ? RECITERS[settings.reciter].name : settings.reciter)); isPlaying = false; }
        });
        audioEl.addEventListener('timeupdate', (e) => {
            const t = e.target, d = t.duration || 0;
            document.getElementById('audioProgressBar').style.width = d ? `${(t.currentTime/d)*100}%` : '0%';
            const f = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
            const a = pageAyahs[currentAyahIndex];
            const ref = a ? ` ${a.surah.number}:${a.numberInSurah}` : '';
            document.getElementById('audioInfo').textContent = `${RECITERS[settings.reciter] ? RECITERS[settings.reciter].name : ''}${ref} - ${f(t.currentTime)} / ${f(d)}`;
        });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error('[SW]', err));
        }

        applyDark();
        document.getElementById('langBtn').textContent = FLAG[currentLang];
        renderReciters();
        updateActiveButtons('speed', settings.speed);
        updateActiveButtons('meal', settings.meal);
        updateActiveButtons('font', settings.font);
        updateActiveButtons('style', mushafStyle);
        updateActiveButtons('latinmode', latinMode);
        document.getElementById('tajweedBtn').classList.toggle('active', !!settings.tajweed);
        document.getElementById('followBtn').classList.toggle('active', !!settings.follow);
        document.documentElement.style.setProperty('--arabic-font', FONT_MAP[settings.font] || FONT_MAP.uthmani);
        if (settings.tajweed) {
            document.getElementById('mushafContainer').style.display = 'none';
            document.querySelector('.zoom-bar').style.display = 'none';
            document.getElementById('tajweedContainer').style.display = 'block';
        }
        if (latinVisible) { document.getElementById('latinContainer').style.display = 'block'; document.getElementById('latinBtn').classList.add('on'); }
        applyZoom();
        updateTexts();

        const savedPage = parseInt(localStorage.getItem('ersenbox_lastPage')) || 1;
        loadPage(savedPage);
    </script>
</body>
</html>
